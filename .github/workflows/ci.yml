name: CI

# Runs on every push/PR to main: typecheck, lint (ESLint) + format check
# (Prettier), build the app, component unit tests (Vitest + React Testing
# Library, jsdom — the "unit" project in vite.config.ts), the Storybook
# accessibility checks (axe, via @storybook/addon-vitest + @storybook/addon-a11y
# — see .storybook/preview.tsx's `a11y.test` parameter, set to 'error'), and
# visual regression (Vitest's built-in toMatchScreenshot, against the
# baselines in src/test/visual/__screenshots__/ — see CLAUDE.md's "Visual
# regression" section and .github/workflows/visual-baselines.yml for how
# those baselines get (re)generated). This is the gate storybook.yml's own
# build job doesn't cover — it only runs `build-storybook`, a separate Vite
# config that doesn't catch every app-level TypeScript error.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm run test:visual
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: .vitest/attachments/
          retention-days: 14
