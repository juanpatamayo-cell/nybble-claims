name: CI

# Runs on every push/PR to main: typecheck, lint (ESLint) + format check
# (Prettier), build the app, component unit tests (Vitest + React Testing
# Library, jsdom — the "unit" project in vite.config.ts), and the Storybook
# accessibility checks (axe, via @storybook/addon-vitest + @storybook/addon-a11y
# — see .storybook/preview.tsx's `a11y.test` parameter, set to 'error'). This
# is the gate storybook.yml's own build job doesn't cover — it only runs
# `build-storybook`, a separate Vite config that doesn't catch every
# app-level TypeScript error.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
